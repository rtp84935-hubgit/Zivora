<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Products</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(120deg,#667eea,#764ba2);
    min-height:100vh;
    padding:40px;
}

h1{
    text-align:center;
    color:white;
    margin-bottom:35px;
}

.request-btn{
    display:inline-block;
    padding:12px 24px;
    background:#667eea;
    color:white;
    text-decoration:none;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:all .3s ease;
    box-shadow:0 5px 12px rgba(102,126,234,.35);
}

.request-btn:hover{
    background:#764ba2;
    color:white;
    text-decoration:none;
    transform:translateY(-3px);
    box-shadow:0 8px 18px rgba(118,75,162,.4);
}

.request-btn:active{
    transform:scale(0.97);
}

.request-btn{
    display:inline-block;
    padding:12px 24px;
    background:#667eea;
    color:white;
    text-decoration:none;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:all .3s ease;
    box-shadow:0 5px 12px rgba(102,126,234,.35);
}

.request-btn:hover{
    background:#764ba2;
    color:white;
    text-decoration:none;
    transform:translateY(-3px);
    box-shadow:0 8px 18px rgba(118,75,162,.4);
}

.request-btn:active{
    transform:scale(0.97);
}
.container{
    width:95%;
    max-width:1200px;
    margin:auto;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 12px 25px rgba(0,0,0,.25);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.content{
    padding:20px;
}

.content h3{
    color:#764ba2;
    margin-bottom:10px;
}

.price{
    color:#27ae60;
    font-size:22px;
    font-weight:bold;
    margin:10px 0;
}

.desc{
    color:#555;
    margin-bottom:20px;
    line-height:1.5;
}

.buttons{
    display:flex;
    justify-content:space-between;
}

.btn{
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
    color:white;
    font-weight:bold;
}

.edit{
    background:#3498db;
}

.delete{
    background:#e74c3c;
}

.back{
    display:block;
    width:180px;
    margin:40px auto 0;
    text-align:center;
    background:white;
    color:#764ba2;
    padding:12px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
}

.back:hover{
    background:#f2f2f2;
}

.empty{
    text-align:center;
    color:white;
    font-size:22px;
    margin-top:60px;
}

</style>

</head>
<script>
setTimeout(function(){
    let alert = document.getElementById("success-alert");
    if(alert){
        alert.style.display = "none";
    }
}, 2000);
</script>
<body>

<h1>Used Products</h1>

<div class="container">

{% if usedproduct %}

<div class="products">

{% for i in usedproduct %}

<div class="card">

<img src="{{ i.product_image.url }}"/>

<div class="content">

<h3>{{ i.product_name }}</h3>

<div class="price">
₹ {{ i.product_price }}
</div>

<div class="desc">
{{ i.product_description }}
</div>








    <a href="/myapp/send_request/{{i.id}}" class="request-btn">
    <i class="fa fa-paper-plane"></i> Request
    </a>
    


{% if messages %}
    {% for message in messages %}
        <div id="success-alert" class="alert alert-success">
            {{ message }}
        </div>
    {% endfor %}
{% endif %} 
</div>

</div>

</div>

{% endfor %}

</div>

{% else %}

<div class="empty">
<i class="fa fa-box-open fa-3x"></i><br><br>
No products added yet.
</div>

{% endif %}

<a href="/myapp/manage_myproduct/" class="back">
<i class="fa fa-arrow-left"></i> Back
</a>

</div>

</body>
</html>
