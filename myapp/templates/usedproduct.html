<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.container{
    width:90%;
    max-width:800px;
}

h1{
    text-align:center;
    color:white;
    margin-bottom:40px;
    font-size:38px;
}

.cards{
    display:flex;
    gap:30px;
    justify-content:center;
    flex-wrap:wrap;
}

.card{
    width:300px;
    height:200px;
    background:white;
    border-radius:20px;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
    color:#333;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
    background:#667eea;
    color:white;
    box-shadow:0 15px 35px rgba(0,0,0,.3);
}

@media(max-width:700px){
    .cards{
        flex-direction:column;
        align-items:center;
    }

    .card{
        width:90%;
    }
}
</style>

</head>
<body>

<div class="container">

    <h1>Used Product Management</h1>

    <div class="cards">

    <a class="card-btn" href="">
        <a href="/myapp/manage_myproduct/" class="card">
            My Products
        </a>

        <a href="/myapp/view_others_products/   " class="card">
            Other Used Products
        </a>

    </div>

</div>

</body>
</html>
