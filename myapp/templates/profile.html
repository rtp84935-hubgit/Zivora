{% extends 'user_home.html' %}

{% block body %}

<form action="" method="post" style="margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center; background:#0f0f1a; font-family:'Segoe UI', Arial, Helvetica, sans-serif; padding:40px 0; box-sizing:border-box;">

    {% csrf_token %}

    <div style="width:380px; background:#1a1a2e; padding:35px 30px; border-radius:16px; box-shadow:0px 10px 30px rgba(0,0,0,0.6); border:1px solid #2a2a40;">

        <h1 align="center" style="color:#e0e0ff; margin-bottom:30px; font-weight:600; letter-spacing:1px;">Profile</h1>

        <div style="text-align:center; margin:0 0 25px 0;">
            <img src="{{ data.image.url }}" width="100px" height="100px" style="border-radius:50%; object-fit:cover; border:3px solid #6c63ff; box-shadow:0 0 15px rgba(108,99,255,0.5);">
        </div>

        <div style="text-align:left; margin:18px 0;">
            <label style="font-weight:600; color:#9a9ab8; font-size:13px; text-transform:uppercase; letter-spacing:0.5px;">Name</label>
            <input type="text" value="{{ data.name }}" readonly style="width:100%; padding:12px; margin-top:6px; border:1px solid #2a2a40; background:#13131f; color:#e0e0ff; border-radius:8px; font-size:15px; box-sizing:border-box;">
        </div>

        <div style="text-align:left; margin:18px 0;">
            <label style="font-weight:600; color:#9a9ab8; font-size:13px; text-transform:uppercase; letter-spacing:0.5px;">Email</label>
            <input type="text" value="{{ data.email }}" readonly style="width:100%; padding:12px; margin-top:6px; border:1px solid #2a2a40; background:#13131f; color:#e0e0ff; border-radius:8px; font-size:15px; box-sizing:border-box;">
        </div>

        <div style="text-align:left; margin:18px 0;">
            <label style="font-weight:600; color:#9a9ab8; font-size:13px; text-transform:uppercase; letter-spacing:0.5px;">Phone</label>
            <input type="text" value="{{ data.phone }}" readonly style="width:100%; padding:12px; margin-top:6px; border:1px solid #2a2a40; background:#13131f; color:#e0e0ff; border-radius:8px; font-size:15px; box-sizing:border-box;">
        </div>

        <div style="text-align:left; margin:18px 0;">
            <label style="font-weight:600; color:#9a9ab8; font-size:13px; text-transform:uppercase; letter-spacing:0.5px;">Place</label>
            <input type="text" value="{{ data.place }}" readonly style="width:100%; padding:12px; margin-top:6px; border:1px solid #2a2a40; background:#13131f; color:#e0e0ff; border-radius:8px; font-size:15px; box-sizing:border-box;">
        </div>

        <center>
        <a href="/myapp/edit_profile/{{data.id}}/" style="display:inline-block; margin-top:25px; padding:11px 28px; border-radius:25px; text-decoration:none; color:#ffffff; background:#6c63ff; font-weight:600; font-size:14px; transition:0.3s;" onmouseover="this.style.background='#5a52e0'; this.style.boxShadow='0 0 12px rgba(108,99,255,0.6)'" onmouseout="this.style.background='#6c63ff'; this.style.boxShadow='none'">
                Update Profile
            </a>

            <br>

            <a href="/myapp/change_password/" style="display:inline-block; margin-top:14px; padding:11px 28px; border-radius:25px; text-decoration:none; color:#6c63ff; background:transparent; border:1px solid #6c63ff; font-weight:600; font-size:14px; transition:0.3s;" onmouseover="this.style.background='rgba(108,99,255,0.1)'" onmouseout="this.style.background='transparent'">
                Change Password
            </a>

            <a href="/myapp/home/" style="display:block; margin-top:22px; text-decoration:none; color:#7a7a9a; font-size:13px;" onmouseover="this.style.color='#9a9ab8'" onmouseout="this.style.color='#7a7a9a'">
                ← Go back to Home
            </a>
        </center>

    </div>

</form>

{% endblock %}
