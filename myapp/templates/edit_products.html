<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Edit Product</title>

<style>

  :root{
    --bg-deep: #0b0a1a;
    --bg-mid: #1a1233;
    --panel: rgba(255,255,255,0.05);
    --panel-border: rgba(255,255,255,0.09);
    --accent-1: #7c6cf0;
    --accent-2: #a78bfa;
    --text-main: #f3f1fb;
    --text-dim: #a9a3c4;
    --field-bg: rgba(255,255,255,0.04);
    --field-border: rgba(255,255,255,0.12);
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', Arial, sans-serif;
    color:var(--text-main);
    background:
      radial-gradient(600px 400px at 85% -5%, rgba(124,108,240,0.35), transparent 60%),
      radial-gradient(500px 350px at 5% 100%, rgba(219,39,168,0.18), transparent 60%),
      linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 55%, #150f2b 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:50px 20px;
  }

  .topbar{
    position:fixed;
    top:0; left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 32px;
    background:linear-gradient(180deg, rgba(10,8,25,0.9), rgba(10,8,25,0));
  }

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .brand-icon{
    width:36px;
    height:36px;
    border-radius:10px;
    background:linear-gradient(135deg, #6d5bf7, #8f7bfb);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
  }

  .brand-text .eyebrow{
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--text-dim);
    text-transform:uppercase;
  }

  .brand-text .title{
    font-size:14px;
    font-weight:700;
  }

  .home-btn{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.14);
    background:rgba(255,255,255,0.04);
    color:var(--text-main);
    font-size:13px;
    font-weight:600;
    text-decoration:none;
    transition:background 0.15s ease, border-color 0.15s ease;
  }

  .home-btn:hover{
    background:rgba(124,108,240,0.18);
    border-color:rgba(124,108,240,0.45);
  }

  .home-btn svg{
    width:15px;
    height:15px;
    stroke:var(--text-main);
  }

  .container{
    width:100%;
    max-width:460px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:22px;
    padding:34px 32px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    margin-top:40px;
  }

  .icon-badge{
    width:56px;
    height:56px;
    margin:0 auto 18px;
    border-radius:50%;
    background:rgba(124,108,240,0.15);
    border:1px solid rgba(124,108,240,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .icon-badge svg{
    width:24px;
    height:24px;
    stroke:var(--accent-2);
  }

  h2{
    margin:0 0 4px;
    text-align:center;
    font-size:22px;
    font-weight:700;
    letter-spacing:0.3px;
  }

  .subtitle{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    margin:0 0 26px;
  }

  label{
    display:block;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.4px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:16px 0 6px;
  }

  input[type="text"],
  input[type="number"],
  textarea{
    width:100%;
    padding:11px 13px;
    background:var(--field-bg);
    border:1px solid var(--field-border);
    border-radius:10px;
    color:var(--text-main);
    font-size:14px;
    outline:none;
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input::placeholder, textarea::placeholder{
    color:#6f6a8f;
  }

  input:focus, textarea:focus{
    border-color:var(--accent-1);
    box-shadow:0 0 0 3px rgba(124,108,240,0.25);
  }

  textarea{
    min-height:90px;
    resize:vertical;
    font-family:inherit;
  }

  .image-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:6px;
  }

  .image-row img{
    width:88px;
    height:72px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid var(--field-border);
    flex-shrink:0;
  }

  .file-wrap{
    flex:1;
  }

  .file-wrap input[type="file"]{
    width:100%;
    padding:9px 10px;
    background:var(--field-bg);
    border:1px dashed var(--field-border);
    border-radius:10px;
    color:var(--text-dim);
    font-size:12px;
  }

  .two-col{
    display:flex;
    gap:14px;
  }

  .two-col > div{
    flex:1;
  }

  button{
    width:100%;
    margin-top:26px;
    padding:14px;
    background:linear-gradient(90deg, #6d5bf7, #a78bfa);
    color:#fff;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.2px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-shadow:0 10px 25px rgba(124,108,240,0.35);
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }

  button:hover{
    transform:translateY(-1px);
    box-shadow:0 14px 30px rgba(124,108,240,0.45);
  }

  button:active{
    transform:translateY(0);
  }

  button svg{
    width:16px;
    height:16px;
    stroke:#fff;
  }

</style>
</head>


<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 L4 14 h6 l-1 8 9-12 h-6 z"/></svg>
    </div>
    <div class="brand-text">
      <div class="eyebrow">Seller Console</div>
      <div class="title">Edit Product</div>
    </div>
  </div>

  <a href="/myapp/seller_home/" class="home-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    Home
  </a>
</div>

<div class="container">

  <div class="icon-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </svg>
  </div>

  <h2>Edit Product</h2>
  <p class="subtitle">Update the details below and save your changes.</p>

  <form action="/myapp/edit_product_post/"
        method="post"
        enctype="multipart/form-data">

    {% csrf_token %}

    <label>Product Name</label>
    <input type="text"
           name="productname"
           value="{{data.ProductName}}"
           placeholder="e.g. Wireless Mouse">

    <div class="two-col">
      <div>
        <label>Price</label>
        <input type="number"
               name="productprice"
               value="{{data.ProductPrice}}"
               placeholder="0.00">
      </div>
      <div>
        <label>Stock</label>
        <input type="number"
               name="productstock"
               value="{{data.ProductStock}}"
               placeholder="0">
      </div>
    </div>

    <label>Quantity</label>
    <input type="text"
           name="productquantity"
           value="{{data.ProductQuantity}}"
           placeholder="e.g. 1 unit / pack">

    <label>Current Image</label>
    <div class="image-row">
      {% if data.ProductImage %}
      <img src="{{data.ProductImage.url}}" alt="Product image">
      {% endif %}
      <div class="file-wrap">
        <input type="file" name="productimage">
      </div>
    </div>

    <label>Description</label>
    <textarea name="productdescription" placeholder="Describe the product...">{{data.ProductDescription}}</textarea>

    <input type="hidden"
           name="id"
           value="{{data.id}}">

    <button type="submit">
      Update Product
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>

  </form>

</div>

</body>
</html>
