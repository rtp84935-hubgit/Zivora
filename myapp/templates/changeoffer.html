!<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Offer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
    overflow:hidden;
}

/* Animated Background */

body::before,
body::after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    filter:blur(120px);
    animation:move 8s ease-in-out infinite alternate;
}

body::before{
    background:#3b82f6;
    top:-100px;
    left:-100px;
}

body::after{
    background:#9333ea;
    bottom:-120px;
    right:-100px;
}

@keyframes move{
    from{
        transform:translateY(-20px);
    }
    to{
        transform:translateY(30px);
    }
}

.card{
    position:relative;
    width:400px;
    padding:40px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(18px);
    border-radius:25px;
    box-shadow:0 20px 40px rgba(0,0,0,.35);
    text-align:center;
    animation:fadeIn .8s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.icon{
    width:80px;
    height:80px;
    margin:auto;
    margin-bottom:20px;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:35px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.08);}
    100%{transform:scale(1);}
}

h2{
    color:white;
    margin-bottom:8px;
    font-size:28px;
}

p{
    color:#cbd5e1;
    margin-bottom:30px;
    font-size:14px;
}

.input-box{
    position:relative;
}

input{
    width:100%;
    padding:16px 55px 16px 20px;
    border:none;
    outline:none;
    border-radius:15px;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:18px;
    transition:.3s;
}

input::placeholder{
    color:#d1d5db;
}

input:focus{
    background:rgba(255,255,255,.18);
    box-shadow:0 0 18px rgba(34,197,94,.4);
}

.percent{
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    color:#22c55e;
    font-size:22px;
    font-weight:bold;
}

button{
    width:100%;
    margin-top:30px;
    padding:15px;
    border:none;
    border-radius:15px;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 25px rgba(34,197,94,.45);
}

button:active{
    transform:scale(.98);
}
</style>

</head>

<body>

<div class="card">

    <div class="icon">
        %
    </div>

    <h2>Add Offer</h2>

    <p>Enter the discount percentage for this product.</p>

  <form action="/myapp/change_offer_post/" method="post">
    {% csrf_token %}
    <input type="hidden" name="id" value="{{ offerss.PRODUCT.id }}">

    <label>Offer Percentage</label>
    <input type="number" name="offer" value="{{ data.off }}" required>

    <button type="submit">Update Offer</button>
</form>
</div>

</body>
</html>
