<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Sign Up</title>

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:30px;
}

.signup-container{
    width:950px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    box-shadow:0 20px 40px rgba(0,0,0,.25);
}

.left-side{
    width:40%;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.left-side h1{
    font-size:42px;
    font-weight:bold;
    margin-bottom:20px;
}

.left-side p{
    font-size:17px;
    text-align:center;
    line-height:30px;
}

.right-side{
    width:60%;
    padding:40px;
}

.right-side h2{
    text-align:center;
    color:#764ba2;
    margin-bottom:30px;
    font-weight:bold;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    font-weight:600;
    color:#555;
}

.form-control{
    height:45px;
    border-radius:10px;
    font-size:15px;
}

.form-control:focus{
    border-color:#764ba2;
    box-shadow:0 0 10px rgba(118,75,162,.25);
}

.btn-signup{
    width:100%;
    height:48px;
    background:#667eea;
    color:#fff;
    border:none;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.btn-signup:hover{
    background:#764ba2;
    color:#fff;
}

.login-link{
    margin-top:20px;
    text-align:center;
}

.login-link a{
    color:#667eea;
    font-weight:bold;
    text-decoration:none;
}

.login-link a:hover{
    color:#764ba2;
    text-decoration:none;
}

@media(max-width:768px){

.signup-container{
    flex-direction:column;
    width:100%;
}

.left-side,
.right-side{
    width:100%;
}

.left-side{
    padding:30px;
}

.right-side{
    padding:25px;
}

}

</style>

</head>
<body>

<div class="signup-container">

<div class="left-side">

<h1>Join Us</h1>

<p>
Create your account to start shopping, explore amazing products, and enjoy a secure online marketplace.
</p>

</div>

<div class="right-side">

<h2>User Registration</h2>

<form action="/myapp/signupost/" method="post" enctype="multipart/form-data">

{% csrf_token %}

<div class="form-group">
<label>Full Name</label>
<input type="text" name="name" class="form-control" placeholder="Enter your full name" required>
</div>

<div class="form-group">
<label>Email Address</label>
<input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
<p id="eid" style="color: red;"></p>
</div>

<div class="form-group">
<label>Phone Number</label>
<input type="text" name="phone" class="form-control" placeholder="Enter your phone number" required>
</div>

<div class="form-group">
<label>Place</label>
<input type="text" name="place" class="form-control" placeholder="Enter your place" required>
</div>

<div class="form-group">
<label>Profile Photo</label>
<input type="file" name="image" class="form-control" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" name="password" class="form-control" placeholder="Create a password" required>
</div>

<button type="submit" class="btn btn-signup">
Create Account
</button>

<div class="login-link">
Already have an account?
<a href="/myapp/login/">Login Here</a>
</div>

</form>

</div>

</div>
<script>
    $(document).ready(function(){
        $('#email').keyup(function(){
            $.ajax({
                url:'/myapp/useremailcheck/',
                method:'GET',
                data:{
                    'email':$('#email').val()
                },success:function(response){
                    if (response.status=='yes'){
                        $('#eid').html('email already used')
                    }
                    else{
                        $('#eid').html(' ')
                    }
                }
            })
        })
    })
</script>
</body>
</html>
