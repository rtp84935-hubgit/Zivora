<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seller Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    padding:30px;
}

.container-box{
    width:950px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    box-shadow:0 20px 40px rgba(0,0,0,.25);
}

.left-panel{
    width:40%;
    background:linear-gradient(135deg,#ff9800,#ff5722);
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.left-panel h1{
    font-size:40px;
    font-weight:bold;
    margin-bottom:20px;
}

.left-panel p{
    font-size:17px;
    text-align:center;
    line-height:30px;
}

.right-panel{
    width:60%;
    padding:40px;
}

.right-panel h2{
    text-align:center;
    color:#ff5722;
    margin-bottom:30px;
    font-weight:bold;
}

.form-label{
    font-weight:600;
}

.form-control{
    height:48px;
    border-radius:10px;
}

.form-control:focus{
    border-color:#ff5722;
    box-shadow:0 0 8px rgba(255,87,34,.3);
}

.btn-register{
    width:100%;
    height:48px;
    border:none;
    border-radius:30px;
    background:#ff5722;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.btn-register:hover{
    background:#e64a19;
}

.login-link{
    text-align:center;
    margin-top:20px;
}

.login-link a{
    text-decoration:none;
    color:#ff5722;
    font-weight:bold;
}

.login-link a:hover{
    color:#e64a19;
}

.alert{
    border-radius:10px;
}

@media(max-width:768px){

.container-box{
    flex-direction:column;
    width:100%;
}

.left-panel,
.right-panel{
    width:100%;
}

.left-panel{
    padding:30px;
}

.right-panel{
    padding:25px;
}

}

</style>

</head>
<body>

<div class="container-box">

    <div class="left-panel">

        <h1>Become a Seller</h1>

        <p>
            Register your seller account and start selling your products to thousands of customers.
        </p>

    </div>

    <div class="right-panel">

        <h2>Seller Registration</h2>

        <form action="/myapp/seller_signup_post/" method="post">

            {% csrf_token %}

            {% if messages %}
                {% for i in messages %}
                <div class="alert alert-warning alert-dismissible fade show">
                    {{ i }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
            {% endif %}

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" class="form-control" name="phone" placeholder="Enter your phone number" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Place</label>
                <input type="text" class="form-control" name="place" placeholder="Enter your place" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" placeholder="Create a password" required>
            </div>

            <button type="submit" class="btn-register">
                Register Seller
            </button>

            <div class="login-link">
                Already have an account?
                <a href="/myapp/login/">Login Here</a>
            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
