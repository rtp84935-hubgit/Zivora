<!DOCTYPE html>
<html>

<head>

<title>Return Product</title>

<style>

body{
    font-family:Arial;
    background:linear-gradient(120deg,#667eea,#764ba2);
}

.box{
    width:450px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px #333;
}

h1{
    text-align:center;
    color:#764ba2;
}


.product{
    background:#f2f2f2;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}


.status{
    background:#facc15;
    padding:8px 15px;
    border-radius:20px;
}


textarea{
    width:100%;
    height:100px;
    padding:10px;
    margin:15px 0;
}


button{

    width:100%;
    padding:12px;
    background:#e11d48;
    color:white;
    border:none;
    border-radius:25px;
    cursor:pointer;

}

</style>

</head>


<body>


<div class="box">


<h1>Return Product</h1>



<div class="product">


<h3>Product Name:{{orders.PRODUCT.ProductName}}</h3>

<p>Order ID : {{orders.ORDER.id}}</p>

<p>Quantity : {{orders.quantity}}</p>

<p>Price : {{orders.ORDER.amount}}</p>


<p>
Status :
<span class="status">
Pending
</span>
</p>


</div>



<form action="/myapp/Return_Order_post/" method="post">
    {% csrf_token %}

    <input type="hidden" name="oid" value="{{orders.id}}"/>
        <input type="hidden" name="quantity" value="{{orders.quantity}}"/>


<label>
Reason for Return
</label>


<textarea placeholder="Enter reason" name="reason"></textarea>



<button>
Request Return
</button>



</form>


</div>


</body>

</html>
