<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Review</title>

<style>
    :root {
        --bg: #0f0f1a;
        --card: #1a1a2e;
        --field: #13131f;
        --border: #2a2a40;
        --text: #e0e0ff;
        --muted: #9a9ab8;
        --star-off: #3a3a55;
        --star-on: #ffc933;
        --accent: #6c63ff;
        --accent-hover: #5a52e0;
        --error: #ff7a8a;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
    }

    .review-box {
        width: 420px;
        max-width: 100%;
        background: var(--card);
        padding: 28px;
        border-radius: 14px;
        border: 1px solid var(--border);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    h1 { margin: 0 0 22px; text-align: center; font-size: 24px; color: var(--text); }

    /* ---------- Product ---------- */
    .product {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px;
        margin-bottom: 24px;
        background: var(--field);
        border: 1px solid var(--border);
        border-radius: 10px;
    }
    .product img, .product .noimg {
        width: 80px; height: 80px; flex: none;
        border-radius: 8px; object-fit: cover;
        background: var(--card); border: 1px solid var(--border);
    }
    .product h3 { margin: 0 0 6px; font-size: 16px; line-height: 1.3; color: var(--text); }
    .product p { margin: 0; font-size: 13px; color: var(--muted); }

    /* ---------- Form ---------- */
    label.title {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: bold;
        color: var(--muted);
    }

    .stars { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
    .star {
        background: none; border: 0; padding: 0;
        font-size: 40px; line-height: 1; cursor: pointer;
        color: var(--star-off);
        transition: color .15s, transform .15s;
    }
    .star.active { color: var(--star-on); }
    .star:hover { transform: scale(1.12); }
    .star:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

    .rating-text { min-height: 20px; margin-bottom: 20px; font-size: 13px; color: var(--muted); }
    .rating-text.error { color: var(--error); }

    textarea {
        width: 100%;
        min-height: 120px;
        padding: 12px;
        resize: vertical;
        font-family: inherit;
        font-size: 14px;
        color: var(--text);
        background: var(--field);
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: border-color .15s, box-shadow .15s;
    }
    textarea::placeholder { color: #6b6b88; }
    textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108, 99, 255, .2); }

    button.submit {
        width: 100%;
        margin-top: 18px;
        padding: 13px;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        transition: background .2s;
    }
    button.submit:hover { background: var(--accent-hover); }
    button.submit:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    .back { display: block; margin-top: 16px; text-align: center; font-size: 13px; color: var(--muted); text-decoration: none; }
    .back:hover { color: var(--text); }

    @media (max-width: 420px) {
        .review-box { padding: 22px 18px; }
        .star { font-size: 36px; }
    }
</style>
</head>

<body>

<div class="review-box">

    <h1>Add Review</h1>

    <div class="product">
        {% if data.PRODUCT.ProductImage %}
            <img src="{{ data.PRODUCT.ProductImage.url }}" alt="{{ data.PRODUCT.ProductName }}">
        {% else %}
            <div class="noimg"></div>
        {% endif %}
        <div>
            <h3>{{ data.PRODUCT.ProductName }}</h3>
            <p>Order ID: {{ data.ORDER.id }}</p>
        </div>
    </div>

    <form method="post" action="/myapp/add_feedback_post/" id="reviewForm" novalidate>
        {% csrf_token %}

        <label class="title" id="ratingLabel">Your rating</label>
        <div class="stars" role="radiogroup" aria-labelledby="ratingLabel">
            <button type="button" class="star" data-value="1" role="radio" aria-checked="false" aria-label="1 star">★</button>
            <button type="button" class="star" data-value="2" role="radio" aria-checked="false" aria-label="2 stars">★</button>
            <button type="button" class="star" data-value="3" role="radio" aria-checked="false" aria-label="3 stars">★</button>
            <button type="button" class="star" data-value="4" role="radio" aria-checked="false" aria-label="4 stars">★</button>
            <button type="button" class="star" data-value="5" role="radio" aria-checked="false" aria-label="5 stars">★</button>
        </div>
        <div class="rating-text" id="ratingText" aria-live="polite">Select a rating</div>

        <input type="hidden" name="star" id="rating" value="">
        <input type="hidden" name="pid" value="{{ data.PRODUCT.id }}">

        <label class="title" for="feedback">Your review</label>
        <textarea name="feedback" id="feedback" placeholder="Tell others what you liked or didn't like about this product" required></textarea>

        <button type="submit" class="submit">Submit Review</button>
        <a class="back" href="/myapp/view_OrderDetails/">&larr; Back to my orders</a>
    </form>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    var stars = document.querySelectorAll(".star");
    var rating = document.getElementById("rating");
    var text = document.getElementById("ratingText");
    var form = document.getElementById("reviewForm");
    var feedback = document.getElementById("feedback");
    var labels = ["", "Poor", "Fair", "Good", "Very good", "Excellent"];
    var current = 0;

    function paint(n) {
        stars.forEach(function (s) {
            s.classList.toggle("active", Number(s.dataset.value) <= n);
        });
    }

    function select(n) {
        current = n;
        rating.value = n;
        paint(n);
        stars.forEach(function (s) {
            s.setAttribute("aria-checked", Number(s.dataset.value) === n ? "true" : "false");
        });
        text.textContent = n + " of 5 - " + labels[n];
        text.classList.remove("error");
    }

    stars.forEach(function (star) {
        star.addEventListener("click", function () { select(Number(this.dataset.value)); });
        star.addEventListener("mouseenter", function () { paint(Number(this.dataset.value)); });
        star.addEventListener("mouseleave", function () { paint(current); });
    });

    form.addEventListener("submit", function (e) {
        if (!rating.value) {
            e.preventDefault();
            text.textContent = "Please select a rating before submitting.";
            text.classList.add("error");
            stars[0].focus();
            return;
        }
        if (!feedback.value.trim()) {
            e.preventDefault();
            feedback.focus();
        }
    });
});
</script>

</body>
</html>
