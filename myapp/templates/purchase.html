{% extends 'user_home.html' %}
{% block body %}

<div style="min-height:100vh; display:flex; justify-content:center; align-items:center; background:#0f0f1a; font-family:'Segoe UI', Arial, Helvetica, sans-serif; padding:40px 20px; box-sizing:border-box;">

<div style="width:360px; background:#1a1a2e; padding:35px 30px; border-radius:16px; box-shadow:0px 10px 30px rgba(0,0,0,0.6); border:1px solid #2a2a40; text-align:center;">

    <div style="width:70px; height:70px; background:rgba(108,99,255,0.1); border:1px solid #6c63ff; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px auto;">
        <i class="fa fa-cart-plus" style="font-size:28px; color:#6c63ff;"></i>
    </div>

    <h1 style="color:#e0e0ff; margin:0 0 25px 0; font-size:22px; font-weight:600; letter-spacing:1px;">
        Purchase
    </h1>

    <form action="/myapp/direct_buy/{{ product.id }}" method="post">

        {% csrf_token %}
        <input type="hidden" value="{{offerprice}}" name="offerprice"/>
        <label style="display:block; text-align:left; font-weight:600; color:#9a9ab8; font-size:13px; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;">
            Enter Quantity
        </label>

        <input type="number" name="quantity" min="1" required style="width:100%; padding:12px; margin-bottom:20px; border:1px solid #2a2a40; background:#13131f; color:#e0e0ff; border-radius:8px; font-size:15px; box-sizing:border-box;">

        <input type="hidden" value="{{ product.id }}" name="pid">

        <button type="submit" style="display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:12px; border:none; border-radius:25px; background:#6c63ff; color:#ffffff; font-weight:600; font-size:14px; letter-spacing:0.5px; cursor:pointer; transition:0.3s;" onmouseover="this.style.background='#5a52e0'" onmouseout="this.style.background='#6c63ff'">
            <i class="fa fa-cart-plus"></i>
            BUY
        </button>

    </form>

    <a href="/myapp/view_user_products/" style="display:block; margin-top:20px; text-decoration:none; color:#7a7a9a; font-size:13px; transition:0.3s;" onmouseover="this.style.color='#9a9ab8'" onmouseout="this.style.color='#7a7a9a'">
        ← Continue Shopping
    </a>

</div>

</div>

{% endblock %}
