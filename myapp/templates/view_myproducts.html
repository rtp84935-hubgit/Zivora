<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Products</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(120deg,#667eea,#764ba2);
    min-height:100vh;
    padding:40px;
}

h1{
    text-align:center;
    color:white;
    margin-bottom:35px;
}

.container{
    width:95%;
    max-width:1200px;
    margin:auto;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 12px 25px rgba(0,0,0,.25);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.content{
    padding:20px;
}

.content h3{
    color:#764ba2;
    margin-bottom:10px;
}

.price{
    color:#27ae60;
    font-size:22px;
    font-weight:bold;
    margin:10px 0;
}

.desc{
    color:#555;
    margin-bottom:20px;
    line-height:1.5;
}

.buttons{
    display:flex;
    justify-content:space-between;
}

.btn{
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
    color:white;
    font-weight:bold;
}

.edit{
    background:#3498db;
}

.delete{
    background:#e74c3c;
}

.back{
    display:block;
    width:180px;
    margin:40px auto 0;
    text-align:center;
    background:white;
    color:#764ba2;
    padding:12px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
}

.back:hover{
    background:#f2f2f2;
}

.empty{
    text-align:center;
    color:white;
    font-size:22px;
    margin-top:60px;
}

</style>

</head>

<body>

<h1>My Products</h1>

<div class="container">

{% if usedproduct %}

<div class="products">

{% for i in usedproduct %}

<div class="card">

<img src="{{ i.product_image.url }}">

<div class="content">

<h3>{{ i.product_name }}</h3>

<div class="price">
₹ {{ i.product_price }}
</div>

<div class="desc">
{{ i.product_description }}
</div>

<div class="buttons">

<!-- <a href="/myapp/edit_myproduct/{{i.id}}" class="btn edit">
<i class="fa fa-edit"></i> Edit
</a> -->

<a href="/myapp/delete_myproduct/{{i.id}}" class="btn delete"
onclick="return confirm('Delete this product?')">
<i class="fa fa-trash"></i> Delete
</a>

</div>

</div>

</div>

{% endfor %}

</div>

{% else %}

<div class="empty">
<i class="fa fa-box-open fa-3x"></i><br><br>
No products added yet.
</div>

{% endif %}

<a href="/myapp/manage_myproduct/" class="back">
<i class="fa fa-arrow-left"></i> Back
</a>

</div>

</body>
</html>
